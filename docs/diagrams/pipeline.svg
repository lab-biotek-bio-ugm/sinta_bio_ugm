<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
      <title id="pipeline-title">SINTA life-science pipeline</title>
      <desc id="pipeline-desc">A university's NIDN roster, minus retired staff, is looked up in SINTA and Google Scholar, merged into one JSON record per lecturer, and analysed offline into publication-title clusters and a co-author network.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pipeline-root { --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #pipeline-root { color: var(--ink); font-family: var(--sans); }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-root .diagram-container { overflow-x: visible; }
      #pipeline-root .step-number, #pipeline-root .step-label, #pipeline-root .lane-label, #pipeline-root .role-text, #pipeline-root .chip-text, #pipeline-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #pipeline-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
      #pipeline-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #pipeline-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #pipeline-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
      #pipeline-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #pipeline-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #pipeline-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #pipeline-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
      #pipeline-root .focal-text { fill: var(--accent); }
      #pipeline-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #pipeline-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }</style>
        <pattern id="pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="0.8" fill="#2d3142" fill-opacity="0.10"/></pattern>
        <marker id="pipeline-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5d75"/></marker>
        <marker id="pipeline-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#eb6c36"/></marker>
      </defs>

      <rect width="840" height="356" fill="#f5f5f5"/>
      <rect width="840" height="356" fill="url(#pipeline-dots)"/>
      <rect x="0" y="36" width="840" height="80" fill="#2d3142" fill-opacity="0.018"/>
      <rect x="0" y="196" width="840" height="80" fill="#2d3142" fill-opacity="0.018"/>

      <!-- Header and lane structure -->
      <line x1="0" y1="36" x2="840" y2="36" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="0" y1="116" x2="840" y2="116" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="0" y1="196" x2="840" y2="196" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="0" y1="276" x2="840" y2="276" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <line x1="140" y1="36" x2="140" y2="276" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>

      <g aria-label="Pipeline steps">
        <rect x="180" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">ROSTER</text>
        <rect x="292" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">SINTA</text>
        <rect x="404" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="420" y="14" class="step-number">03</text><text x="420" y="29" class="step-label">SCHOLAR</text>
        <rect x="516" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">STORE</text>
        <rect x="628" y="6" width="32" height="16" rx="8" fill="#eb6c36" fill-opacity="0.20"/><text x="644" y="14" class="step-number focal-text">05</text><text x="644" y="29" class="step-label focal-text">CLUSTER</text>
        <rect x="740" y="6" width="32" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/><text x="756" y="14" class="step-number">06</text><text x="756" y="29" class="step-label">NETWORK</text>
      </g>

      <g aria-label="Lanes">
        <text x="70" y="72" class="lane-label">DATA</text><text x="70" y="84" class="lane-label">FILES</text>
        <text x="70" y="152" class="lane-label">SCRAPE</text><text x="70" y="164" class="lane-label">NETWORK</text>
        <text x="70" y="232" class="lane-label">ANALYSIS</text><text x="70" y="244" class="lane-label">OFFLINE</text>
      </g>

      <!-- Connectors first. r=8 orthogonal elbows. -->
      <path d="M246 76 H300 Q308 76 308 84 V124" fill="none" stroke="#4f5d75" marker-end="url(#pipeline-arr-muted)"/>
      <path d="M358 156 H370" fill="none" stroke="#4f5d75" marker-end="url(#pipeline-arr-muted)"/>
      <path d="M470 156 H524 Q532 156 532 148 V108" fill="none" stroke="#4f5d75" marker-end="url(#pipeline-arr-muted)"/>
      <path d="M582 64 H748 Q756 64 756 72 V204" fill="none" stroke="#4f5d75" marker-end="url(#pipeline-arr-muted)"/>
      <path d="M582 88 H636 Q644 88 644 96 V204" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#pipeline-arr-accent)"/>
      <rect x="652" y="148" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="674" y="157" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TITLES</text>

      <!-- Data files: NIDN roster -->
      <rect x="146" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="150" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="159" y="55" class="role-text">DAT</text>
      <text x="196" y="67" class="node-title">NIDN Roster</text><text x="196" y="79" class="node-sub">minus retired list</text><text x="196" y="91" class="node-tool">data/raw/&lt;SET&gt;/</text>
      <rect x="226" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="234" y="104" class="chip-text">DB</text>

      <!-- Scrape: SINTA lookup -->
      <rect x="258" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="262" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="271" y="135" class="role-text">NET</text>
      <text x="308" y="147" class="node-title">SINTA Lookup</text><text x="308" y="159" class="node-sub">profile · scholar id</text><text x="308" y="171" class="node-tool">sinta-scraper</text>
      <rect x="262" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="270" y="184" class="chip-text">DB</text>
      <rect x="338" y="178" width="16" height="8" rx="3" fill="#6e6479"/><text x="346" y="184" class="chip-text">WB</text>

      <!-- Scrape: Google Scholar -->
      <rect x="370" y="124" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="374" y="128" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="383" y="135" class="role-text">NET</text>
      <text x="420" y="147" class="node-title">Google Scholar</text><text x="420" y="159" class="node-sub">pubs · co-authors</text><text x="420" y="171" class="node-tool">scholarly · JSON cache</text>
      <rect x="374" y="178" width="16" height="8" rx="3" fill="#6e6479"/><text x="382" y="184" class="chip-text">WB</text>
      <rect x="450" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="458" y="184" class="chip-text">DB</text>

      <!-- Data files: merged JSON -->
      <rect x="482" y="44" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="486" y="48" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="495" y="55" class="role-text">DAT</text>
      <text x="532" y="67" class="node-title">life_science.json</text><text x="532" y="79" class="node-sub">1 record / lecturer</text><text x="532" y="91" class="node-tool">data/processed/&lt;SET&gt;/</text>
      <rect x="486" y="98" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="494" y="104" class="chip-text">DB</text>
      <rect x="562" y="98" width="16" height="8" rx="3" fill="#b8915a"/><text x="570" y="104" class="chip-text">TB</text>

      <!-- Analysis: title clusters (focal) -->
      <rect x="594" y="204" width="100" height="64" rx="6" fill="#eb6c36" fill-opacity="0.07" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="598" y="208" width="18" height="10" rx="3" fill="#eb6c36" fill-opacity="0.20"/><text x="607" y="215" class="role-text focal-text">ANA</text>
      <text x="644" y="227" class="node-title">Title Clusters</text><text x="644" y="239" class="node-sub">TF-IDF · PCA · KMeans</text><text x="644" y="251" class="node-tool">figures/&lt;SET&gt;/01_*</text>
      <rect x="598" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="264" class="chip-text">TB</text>
      <rect x="674" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="264" class="chip-text">FL</text>

      <!-- Analysis: co-author network -->
      <rect x="706" y="204" width="100" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.25"/>
      <rect x="710" y="208" width="18" height="10" rx="3" fill="#2d3142" fill-opacity="0.12"/><text x="719" y="215" class="role-text">ANA</text>
      <text x="756" y="227" class="node-title">Co-author Network</text><text x="756" y="239" class="node-sub">main → co-authors</text><text x="756" y="251" class="node-tool">*.graphml · 02_*.png</text>
      <rect x="710" y="258" width="16" height="8" rx="3" fill="#b8915a"/><text x="718" y="264" class="chip-text">TB</text>
      <rect x="786" y="258" width="16" height="8" rx="3" fill="#9c6b50"/><text x="794" y="264" class="chip-text">FL</text>

      <!-- Legend: steps -->
      <text x="164" y="293" class="legend-label">STEPS</text>
      <rect x="180" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Roster</text>
      <rect x="272" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="284" y="292" class="step-number">02</text><text x="304" y="293" class="legend-text">SINTA</text>
      <rect x="360" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="372" y="292" class="step-number">03</text><text x="392" y="293" class="legend-text">Scholar</text>
      <rect x="452" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="464" y="292" class="step-number">04</text><text x="484" y="293" class="legend-text">Store</text>
      <rect x="540" y="284" width="24" height="12" rx="6" fill="#eb6c36" fill-opacity="0.20"/><text x="552" y="292" class="step-number focal-text">05</text><text x="572" y="293" class="legend-text">Cluster</text>
      <rect x="632" y="284" width="24" height="12" rx="6" fill="#2d3142" fill-opacity="0.12"/><text x="644" y="292" class="step-number">06</text><text x="664" y="293" class="legend-text">Network</text>

      <!-- Legend: data types -->
      <text x="164" y="314" class="legend-label">DATA TYPE</text>
      <rect x="180" y="306" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="188" y="312" class="chip-text">DB</text><text x="202" y="314" class="legend-text">Raw file</text>
      <rect x="256" y="306" width="16" height="8" rx="3" fill="#6e6479"/><text x="264" y="312" class="chip-text">WB</text><text x="278" y="314" class="legend-text">Web API</text>
      <rect x="332" y="306" width="16" height="8" rx="3" fill="#b8915a"/><text x="340" y="312" class="chip-text">TB</text><text x="354" y="314" class="legend-text">Author records</text>
      <rect x="428" y="306" width="16" height="8" rx="3" fill="#9c6b50"/><text x="436" y="312" class="chip-text">FL</text><text x="450" y="314" class="legend-text">Figure / graph</text>
      <text x="532" y="314" class="legend-text">left chip = input · right chip = output</text>

      <!-- Legend: flow -->
      <text x="164" y="336" class="legend-label">FLOW</text>
      <line x1="180" y1="333" x2="204" y2="333" stroke="#4f5d75" marker-end="url(#pipeline-arr-muted)"/><text x="212" y="336" class="legend-text">Hand-off</text>
      <line x1="300" y1="333" x2="324" y2="333" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#pipeline-arr-accent)"/><text x="332" y="336" class="legend-text">Focal hand-off</text>
    </svg>
